opcua:
  endpoint: opc.tcp://192.168.1.103:4840   # S7-1215C PLC_2, FW V4.6
  security: None          # server offers only None/None + Anonymous
  username: null
  password: null
  publishing_interval_ms: 1000
  # Siemens server interfaces root (ns resolved from the URI at connect, not hardcoded)
  interfaces_root: {uri: "http://www.siemens.com/simatic-s7-opcua", id: ServerInterfaces}
mqtt:
  host: 192.168.1.51
  port: 1883
  client_id: opcua-bridge
  retain: false
publish:
  mode: on_change         # publish whole topic object when any of its nodes changes
  min_interval_s: 1.0     # throttle per topic
  heartbeat_s: 60         # republish last values even without change
# Node addressing: "@<Interface>/<path>" = browse path under ServerInterfaces by browse names
# ("*" as interface = search all interfaces for the next segment), or a plain node id "ns=..;i=..".
# Paths are resolved at every connect, so renamed interfaces / changed ns indexes / added nodes do not break.
topics:
  Sensors/PLC_2:
    LVL: "@*/Sensors_DB/Input/LVL"
    Temp: "@*/Sensors_DB/Input/Temp"
    G_Temp_Mid: "@*/Sensors_DB/Output/G_Temp_Mid"
    G_Temp_Top: "@*/Sensors_DB/Output/G_Temp_Top"
    G_Temp_PF1: "@*/Sensors_DB/Output/G_Temp_PF-1"
    DWC_Air_Temp_TT: "@*/Sensors_DB/Output/DWC_Air_Temp_TT"
    DWC_ppm: "@*/Sensors_DB/Output/DWC_ppm"
    DWC_Level: "@*/Sensors_DB/Output/DWC_Level"
    DWC_Water_Temp: "@*/Sensors_DB/Output/DWC_Water_Temp"
    F1_Temp: "@*/Sensors_DB/Output/F1_Temp"
# PID_Temp instances: state -> Sensors/PLC_2/<key>_PID, commands <- Myko/Cmd/<key>_PID (ack on .../ack)
pids:
  F1: {instance: PID_Temp_F1, limits: [-30, 50]}   # Kylmäsäilytystila 1 (fallback = last read InLo/InHi)
  T1: {instance: Terrarium_1_Temp, limits: [5, 45]}  # Terrario 1 (fallback = PV feed range)
  G_Air: {instance: G_Air, limits: [0, 50], monitor: poll, poll_s: 5, nodes: [SP, PV, State, Err, ErrBits, Warn, Mode, CSP, OutSum]}  # Kasvamo ilma, PF-1. monitor:poll = Read service every poll_s (no monitored items): adding G_Air items makes the S7-1200 reject F1/T1 subscriptions too (0x80DB0000)
pid_nodes:   # short key -> path inside the instance DB
  SP: Setpoint
  PV: Input
  Dist: Disturbance
  ManEn: ManualEnable
  ManVal: ManualValue
  ScPV: ScaledInput
  OutHeat: OutputHeat
  OutCool: OutputCool
  SPLimH: SetpointLimit_H
  SPLimL: SetpointLimit_L
  PVWarnH: InputWarning_H
  PVWarnL: InputWarning_L
  State: State
  Err: Error
  ErrBits: ErrorBits
  Mode: Mode
  Warn: Warning
  CSP: CurrentSetpoint
  OutSum: PidOutputSum
  DisCool: DisableCooling
  InHi: Config/InputUpperLimit
  InLo: Config/InputLowerLimit
  ActCool: Config/ActivateCooling
  HGain: Retain/CtrlParams/Heat/Gain
  HTi: Retain/CtrlParams/Heat/Ti
  HTd: Retain/CtrlParams/Heat/Td
  HCyc: Retain/CtrlParams/Heat/Cycle
  CGain: Retain/CtrlParams/Cool/Gain
  CTi: Retain/CtrlParams/Cool/Ti
  CTd: Retain/CtrlParams/Cool/Td
  CCyc: Retain/CtrlParams/Cool/Cycle
  HDZ: Retain/CtrlParams/Heat/DeadZone      # read only (no write in whitelist)
  CDZ: Retain/CtrlParams/Cool/DeadZone
  Prog: Progress                           # tuning progress %
  HEnTune: Heat/EnableTuning
  CEnTune: Cool/EnableTuning
  SUTSt: PIDSelfTune/SUT/State             # pretuning phase
  TIRSt: PIDSelfTune/TIR/State             # fine tuning phase
  SUTHOk: PIDSelfTune/SUT/ProcParHeatOk
  SUTCOk: PIDSelfTune/SUT/ProcParCoolOk
pid_commands:  # write whitelist (same for every PID); tuning params are NOT writable
  Setpoint:     {path: Setpoint,     type: Float,   clamp_to: [InLo, InHi]}
  Input:        {path: Input,        type: Float,   clamp_to: [InLo, InHi], log_every: 60}  # Myko PV feed (backend pvfeed.js, switch default OFF)
  ManualEnable: {path: ManualEnable, type: Boolean}
  ManualValue:  {path: ManualValue,  type: Float,   min: -100, max: 100}
  Mode:         {path: Mode,         type: Int16,   allowed: [0, 1, 2, 3, 4]}  # 1 pretuning, 2 fine tuning
  ModeActivate: {path: ModeActivate, type: Boolean, pulse: true}
  ErrorAck:     {path: ErrorAck,     type: Boolean, pulse: true}
  HeatEnableTuning: {path: Heat/EnableTuning, type: Boolean}   # tuning target selection (written before Mode/ModeActivate)
  CoolEnableTuning: {path: Cool/EnableTuning, type: Boolean}
